<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso Docente</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { max-width: 450px; width: 95%; padding: 40px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; text-align: left; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; }
        #btnIngresar { background-color: var(--primary-color); color: white; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; border-radius: 8px; }
        #btnIngresar:hover { filter: brightness(1.2); }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container login-card">
        <h1>Acceso al Portal</h1>
        <p class="metadata">Gestión Académica - Ing. Jorge Luis Abreu</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Perfil:</label>
                <select id="rolSelector" required>
                    <option value="">-- Seleccione --</option>
                    <option value="Profesor">Profesor</option>
                    <option value="Coordinacion">Coordinación</option>
                    <option value="Estudiante">Estudiante</option>
                </select>
            </div>

            <div id="camposDinamicos"></div>

            <button type="submit" id="btnIngresar" style="display:none;">Ingresar</button>
        </form>
        <div id="mensaje"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
