<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portafolio Docente</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Roboto', sans-serif; }
        .login-card { max-width: 450px; width: 90%; margin: 20px; padding: 40px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--primary-color); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; box-sizing: border-box; }
        #btnIngresar { background-color: var(--primary-color); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.1em; transition: 0.3s; width: 100%; margin-top: 10px; }
        #btnIngresar:hover { background-color: #00695c; box-shadow: var(--shadow); }
        .loader { color: var(--primary-color); text-align: center; font-style: italic; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container login-card">
        <h1>Acceso</h1>
        <p class="metadata" style="text-align: center;">Sistema de Gestión de Recursos Docentes</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Perfil:</label>
                <select id="rolSelector" required>
                    <option value="">-- Seleccione --</option>
                    <option value="Profesor">Profesor</option>
                    <option value="Coordinacion">Coordinación</option>
                    <option value="Estudiante">Estudiante</option>
                </select>
            </div>

            <div id="camposDinamicos"></div>

            <button type="submit" id="btnIngresar" style="display:none;">Ingresar al Sistema</button>
        </form>
        <div id="mensaje" class="loader"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
